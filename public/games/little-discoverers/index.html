<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Discoverers</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#e9f7ee;color:#243a2c;font:18px system-ui,sans-serif}main{max-width:950px;margin:auto;padding:20px}button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:22px;padding:18px;background:#fff;box-shadow:0 4px 0 #243a2c18;touch-action:manipulation}button:focus-visible{outline:4px solid #7145b6;outline-offset:3px}button:disabled{cursor:default;opacity:.65}h1{font-size:30px;margin-bottom:8px}p{line-height:1.5}#menu,.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}#menu button{width:170px;min-height:140px}button b{display:block;font-size:48px}#board{text-align:center;background:#ffffff60;border-radius:28px;padding:24px;margin:22px 0;min-height:310px}#scene{font-size:74px;margin:18px}#message{min-height:30px;font-weight:700;color:#476331}.slot{display:inline-flex;min-width:100px;min-height:90px;align-items:center;justify-content:center;border:3px dashed #709c90;border-radius:20px;margin:8px;padding:12px}.done{background:#d8f3c4!important}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:520px;margin:auto}.memory button{font-size:36px;min-height:80px}svg{width:100%;max-width:620px;height:auto;touch-action:none}svg text{pointer-events:none;font:bold 16px system-ui;fill:#243a2c}svg circle{cursor:pointer}#home{font-size:15px;padding:12px 18px}#next{background:#ffdb86;margin-top:12px}#next[hidden]{display:none}@media(max-width:500px){main{padding:14px}#board{padding:14px}.choices button{padding:14px}.slot{min-width:80px}h1{font-size:26px}}
</style></head><body><main><button id="home" hidden aria-label="Hold to return to the game menu">🏠 Hold for menu</button><h1 id="title">Little Discoverers 🌱</h1><p id="instructions">Ages 3–5. Choose an adventure. Tap, drag and discover at your own pace.</p><div id="menu"></div><section id="board" hidden></section><p id="message" role="status" aria-live="polite"></p><button id="next" hidden>Play again ↻</button></main><script>
const games=[['abc-catch','ABC Catch','🔤','#f7df8c'],['number-trail','Number Trail','🔢','#c9e9ff'],['months-match','Months Match','📅','#ddcef6'],['weather-dress-up','Weather Dress-Up','🌦️','#facfdf'],['rhyme-match','Rhyme Match','🐱','#ffdbb1'],['memory-flip','Memory Flip','🃏','#bfe7e9'],['garden-grower','Garden Grower','🌱','#cfe8b9'],['shape-builder','Shape Builder','🔷','#ffd7af'],['missing-piece','Missing Piece','🧩','#dcd3f7']];
const $=id=>document.getElementById(id),board=$('board');let current,round=0,cleanup=()=>{},homeTimer;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function say(text){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=.8;speechSynthesis.speak(u)}}
function button(text,fn,parent=board){let b=document.createElement('button');b.textContent=text;b.onclick=fn;parent.append(b);return b}
function prompt(text){$('instructions').textContent=text}
function win(){cleanup();$('message').textContent='Wonderful exploring! ⭐';$('next').hidden=false}
function feedback(ok){$('message').textContent=ok?'Yes! Keep going! ✨':'Try another one. You can do it!';return ok}
function choices(){let d=document.createElement('div');d.className='choices';board.append(d);return d}
function scene(text){let d=document.createElement('div');d.id='scene';d.textContent=text;board.append(d);return d}
function start(id){cleanup();current=games.find(g=>g[0]===id);if(!current)return menu();round++;$('menu').hidden=true;board.hidden=false;board.replaceChildren();$('title').textContent=current[2]+' '+current[1];$('home').hidden=false;$('next').hidden=true;$('message').textContent='';cleanup=()=>{};run(id)}
function menu(){cleanup();if('speechSynthesis'in window)speechSynthesis.cancel();board.hidden=true;$('home').hidden=true;$('next').hidden=true;$('message').textContent='';$('title').textContent='Little Discoverers 🌱';prompt('Ages 3–5. Choose an adventure. Tap, drag and discover at your own pace.');$('menu').hidden=false}
function run(id){
if(id==='abc-catch'){let letters=shuffle('ABCDEFGHJKLMNPQRSTUVWXYZ'.split('')).slice(0,5),target=letters[0];prompt('Catch the called letter! Tap the speaker to hear it again.');button('🔊 Catch '+target,()=>say('Catch the letter '+target));say('Catch the letter '+target);let row=choices(),elapsed=0;shuffle(letters).forEach(l=>{let b=button(l,()=>{if(feedback(l===target)){row.querySelectorAll('button').forEach(c=>c.disabled=true);win()}},row);b.style.fontSize='40px';b.style.background=current[3]});let tick=setInterval(()=>{elapsed++;[...row.children].forEach((b,i)=>b.style.transform=`translateY(${Math.sin(elapsed/6+i)*14}px)`)},100);cleanup=()=>clearInterval(tick)}
if(id==='number-trail'){prompt('Connect the dots from 1 to 10. Tap each next dot, or draw through them.');let ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 600 320');svg.setAttribute('aria-label','Number trail from 1 to 10');board.append(svg);let points=Array.from({length:10},(_,i)=>[55+i*54,160+Math.sin(i*.9)*95]),next=0;let line=document.createElementNS(ns,'polyline');line.setAttribute('fill','none');line.setAttribute('stroke','#55a782');line.setAttribute('stroke-width','7');svg.append(line);points.forEach(([x,y],i)=>{let g=document.createElementNS(ns,'g'),c=document.createElementNS(ns,'circle'),t=document.createElementNS(ns,'text');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',22);c.setAttribute('fill','#fff');c.setAttribute('stroke','#86b9a6');c.setAttribute('tabindex','0');c.setAttribute('role','button');c.setAttribute('aria-label','Dot '+(i+1));t.setAttribute('x',x);t.setAttribute('y',y+5);t.setAttribute('text-anchor','middle');t.textContent=i+1;const pick=()=>{if(i!==next){if(i>next)feedback(false);return}c.setAttribute('fill','#ffda84');next++;line.setAttribute('points',points.slice(0,next).map(p=>p.join(',')).join(' '));if(next===10)win();else $('message').textContent='Next: '+(next+1)};c.onpointerdown=pick;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}};g.append(c,t);svg.append(g);c.dataset.index=i;c.pick=pick});svg.onpointermove=e=>{if(!e.buttons)return;let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(svg.getScreenCTM().inverse());if(next<10&&Math.hypot(p.x-points[next][0],p.y-points[next][1])<25)svg.querySelectorAll('circle')[next].pick()}}
if(id==='months-match'){let months=['January','February','March','April','May','June','July','August','September','October','November','December'],n=0;prompt('Put the months in order, starting with January. Tap or drag a card to the next slot.');let slot=document.createElement('div');slot.className='slot';board.append(slot);let row=choices();function update(){slot.textContent=(n+1)+'. '+(n===0?'January':'After '+months[n-1]+'?')}update();function pick(name,b){if(!feedback(name===months[n]))return;b.disabled=true;b.classList.add('done');n++;if(n===12){slot.textContent='A whole year! 🎉';win()}else update()}shuffle(months).forEach(name=>{let b=button(name,()=>pick(name,b),row);b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',name)});slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();let name=e.dataTransfer.getData('text/plain'),b=[...row.children].find(b=>b.textContent===name&&!b.disabled);if(b)pick(name,b)}}
if(id==='weather-dress-up'){let weather=[['☀️ Sunny','🧢 Sun hat','🕶️ Sunglasses'],['🌧️ Rainy','🧥 Raincoat','🥾 Rain boots'],['❄️ Snowy','🧣 Scarf','🧤 Mittens']][round%3],found=0;prompt('Pick two things to wear when it is '+weather[0].slice(3).toLowerCase()+'.');scene(weather[0]);let outfit=scene('🧒'),row=choices();shuffle(['🧢 Sun hat','🕶️ Sunglasses','🧥 Raincoat','🥾 Rain boots','🧣 Scarf','🧤 Mittens']).forEach(item=>{let b=button(item,()=>{if(feedback(weather.includes(item))){b.disabled=true;outfit.textContent+=' '+item.split(' ')[0];if(++found===2)win()}},row)})}
if(id==='rhyme-match'){let pairs=shuffle([['cat 🐱','hat 🎩'],['dog 🐶','log 🪵'],['bee 🐝','tree 🌳']]),count=0,selected=null;prompt('Drag each word to its rhyme, or tap a word then its match. Tap the speaker to hear the words.');button('🔊 Hear words',()=>say('Cat, hat. Dog, log. Bee, tree.'));let targets=choices(),row=choices();function match(i){if(selected===null)return feedback(false);if(!feedback(selected.i===i))return;selected.b.disabled=true;selected.b.style.outline='';targets.children[i].textContent=pairs[i].join(' + ');targets.children[i].disabled=true;selected=null;if(++count===3)win()}pairs.forEach((p,i)=>{let b=button(p[0],()=>match(i),targets);b.className='slot';b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();match(i)}});shuffle(pairs.map((p,i)=>({word:p[1],i}))).forEach(({word,i})=>{let b=button(word,()=>{[...row.children].forEach(c=>c.style.outline='');selected={i,b};b.style.outline='3px solid #7145b6'},row);b.draggable=true;b.ondragstart=()=>{selected={i,b}}})}
if(id==='memory-flip'){prompt('Flip two cards. Can you find all four matching pairs?');let row=document.createElement('div');row.className='memory';board.append(row);let open=[],matched=0,locked=false,timer;cleanup=()=>clearTimeout(timer);shuffle(['🐱','🐱','🌻','🌻','🍎','🍎','🦋','🦋']).forEach(face=>{let b=button('★',()=>{if(locked||b.disabled||open.some(x=>x.b===b))return;b.textContent=face;open.push({b,face});if(open.length===2){if(open[0].face===open[1].face){open.forEach(c=>{c.b.disabled=true;c.b.classList.add('done')});open=[];if(++matched===4)win();else feedback(true)}else{locked=true;timer=setTimeout(()=>{open.forEach(c=>c.b.textContent='★');open=[];locked=false;feedback(false)},1000)}}},row);b.setAttribute('aria-label','Flip card')})}
if(id==='garden-grower'){prompt('Water each seed three times to grow a fruity garden.');let row=choices(),complete=0;['🍎','🍓','🍊'].forEach(fruit=>{let stage=0;let b=button('🌰',()=>{stage++;b.textContent=['🌰','🌱','🌿',fruit][stage];b.setAttribute('aria-label',stage===3?'Grown fruit':'Water plant, '+(3-stage)+' splashes left');feedback(true);if(stage===3){b.disabled=true;if(++complete===3)win()}},row);b.style.fontSize='70px';b.setAttribute('aria-label','Water seed')});scene('💧 Tap a seed to water it')}
if(id==='shape-builder'){let plans=[['house','🏠',['🔺 Roof','🟨 Wall','🟫 Door']],['train','🚂',['🟦 Engine','🟩 Wagon','⚫ Wheels']],['rocket','🚀',['🔺 Nose','🟦 Body','🔴 Window']]],plan=plans[round%3],n=0;prompt('Build a '+plan[0]+'. Tap or drag the shape shown in the building slot.');let picture=scene(''),slot=document.createElement('div');slot.className='slot';slot.textContent=plan[2][0];board.append(slot);let row=choices();function pick(item,b){if(!feedback(item===plan[2][n]))return;b.disabled=true;picture.textContent+=' '+item.split(' ')[0];if(++n===3){picture.textContent=plan[1];slot.textContent='You built a '+plan[0]+'!';win()}else slot.textContent=plan[2][n]}shuffle([...plan[2],'⭐ Star','💜 Heart']).forEach(item=>{let b=button(item,()=>pick(item,b),row);b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',item)});slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();let item=e.dataTransfer.getData('text/plain'),b=[...row.children].find(c=>c.textContent===item&&!c.disabled);if(b)pick(item,b)}}
if(id==='missing-piece'){let sets=[['🌻','🌳','🦋','☀️'],['🍎','🍌','🍓','🍊'],['🐱','🐶','🐰','🐻']],items=sets[round%3],missing=round%4;prompt('Look closely at the picture. Tap Ready, then spot what disappears.');let picture=scene(items.join(' ')),row=choices();button('Ready! 👀',()=>{picture.textContent=items.map((s,i)=>i===missing?'❓':s).join(' ');row.replaceChildren();prompt('Which piece is missing?');shuffle(items).forEach(item=>button(item,()=>{if(feedback(item===items[missing])){picture.textContent=items.join(' ');row.querySelectorAll('button').forEach(b=>b.disabled=true);win()}},row))},row)}
}
games.forEach(g=>{let b=button('',()=>start(g[0]),$('menu'));b.style.background=g[3];let icon=document.createElement('b');icon.textContent=g[2];b.append(icon,document.createTextNode(g[1]))});
$('next').onclick=()=>start(current[0]);
function cancelHold(){clearTimeout(homeTimer)}
$('home').onpointerdown=e=>{e.preventDefault();cancelHold();homeTimer=setTimeout(menu,900)};['pointerup','pointerleave','pointercancel'].forEach(event=>$('home').addEventListener(event,cancelHold));$('home').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();homeTimer=setTimeout(menu,900)}};$('home').onkeyup=cancelHold;window.addEventListener('blur',cancelHold);
const requested=new URLSearchParams(location.search).get('game');if(games.some(g=>g[0]===requested))start(requested);
</script></body></html>

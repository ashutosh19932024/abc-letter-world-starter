<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Tinkers</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

h1{margin:0 0 4px;font-size:26px}
.sub{margin:0 0 16px;color:var(--mute);font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;max-width:900px}
#grid button{border:0;border-radius:26px;padding:18px 8px 12px;cursor:pointer;color:#2b2118;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
#grid b{font-size:58px;line-height:1}
#grid span{font:600 14px system-ui,sans-serif}
#home{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:104px;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,.85);color:#2b2118;overflow:hidden;font-size:16px;z-index:5;touch-action:none;-webkit-touch-callout:none}
#home i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,140,100,.55);transition:width .9s linear}
#home.on i{width:100%}
#home em{position:relative;font-style:normal}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="home" hidden aria-label="Hold to go back"><i></i><em>🏠 Hold</em></button>
<div id="menu"><h1>Tiny Tinkers 🧩</h1><p class="sub">Ages 2–3. Drag, match and count. There is no losing: a wrong try just wiggles back. Parents: hold 🏠 to exit a game.</p><div id="grid"></div></div>

(function(){

}
function choice(g,build){
 g.init=function(){S={ch:[],w:0,back:null,idle:0};build(S);S.ch.forEach(function(c){c.w=0})};

var FD=[['🐰','🥕'],['🐵','🍌'],['🐶','🦴'],['🐮','🌾'],['🐻','🍯'],['🐦','🌽']],JS=['🦁','🐘','🐠','🌻','🚗'];

var WORDS=['one','two','three','four','five'];
var G=[
drag({n:'Shapes',e:'🔷',bg:'#fff1cc',cap:'Put each shape in its hole'},bShape),
choice({n:'Match',e:'🐶',bg:'#ffe3ec',cap:'Find the same one'},bMatch),
drag({n:'Feed Me',e:'🥕',bg:'#e3f5d0',cap:'Feed the hungry friend'},bFeed),
choice({n:'Big & Small',e:'🐘',bg:'#dbeaff'},bBig),
drag({n:'Color Train',e:'🚂',bg:'#ffe9d2',cap:'Match the colors'},bTrain),
{n:'Count Mangoes',e:'🥭',bg:'#fff4c2',cap:'Tap each mango to count',
 init:function(){var n=1+Math.floor(Math.random()*5);this.n=n;this.c=0;this.w=0;this.a=[];for(var i=0;i<n;i++)this.a.push({x:W*(.5+(i-(n-1)/2)*Math.min(.18,.8/n)),y:H*(.45+(i%2)*.2),k:0})},

 tap:function(px,py){var s=Math.min(W*.16,H*.12,90),g=this;if(g.w>0)return;g.a.forEach(function(m){if(!m.k&&hit(px,py,m.x,m.y,s*.8)){m.k=++g.c;speak(WORDS[g.c-1]);tone(400+g.c*80,.12);if(g.c===g.n){g.w=110;good()}}})}},
{n:'Which Cup?',e:'🥤',bg:'#dff5e8',
 init:function(){var g=this;g.ph=0;g.tm=0;g.k=0;g.ball=Math.floor(Math.random()*3);g.c=[0,1,2].map(function(i){return {id:i,slot:i,x:W*(.2+i*.3),up:1,t:1}});g.sw=[];for(var i=0;i<4;i++){var a=Math.floor(Math.random()*3);g.sw.push([a,(a+1+Math.floor(Math.random()*2))%3])}},
 update:function(dt){var g=this;g.cap=['Watch the ball!','Watch the ball!','Follow the cups…','Where is the ball? Tap a cup','Here is the ball!'][g.ph];g.tm+=dt;g.c.forEach(function(c){c.x+=(W*(.2+c.slot*.3)-c.x)*.18*dt;c.up+=(c.t-c.up)*.2*dt});
  if(g.ph===0&&g.tm>90){g.ph=1;g.tm=0;g.c.forEach(function(c){c.t=0})}
  else if(g.ph===1&&g.tm>30){g.ph=2;g.tm=0}

$('grid').innerHTML=G.map(function(g,i){return '<button data-i="'+i+'" style="background:'+g.bg+'"><b>'+g.e+'</b><span>'+g.n+'</span></button>'}).join('');

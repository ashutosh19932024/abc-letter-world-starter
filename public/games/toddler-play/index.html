<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toddler Play</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}

.sub{margin:0 0 16px;color:var(--mute);font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;max-width:900px}
#grid button{border:0;border-radius:26px;padding:18px 8px 12px;cursor:pointer;color:#2b2118;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.15)}

#grid span{font:600 14px system-ui,sans-serif}
#home{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:104px;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,.85);color:#2b2118;overflow:hidden;font-size:16px;z-index:5;touch-action:none;-webkit-touch-callout:none}
#home i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,140,100,.55);transition:width .9s linear}
#home.on i{width:100%}
#home em{position:relative;font-style:normal}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="home" hidden aria-label="Hold to go back"><i></i><em>🏠 Hold</em></button>
<div id="menu"><h1>Toddler Play 🧸</h1><p class="sub">Ages 1–3. Tap, touch, explore. No scores, no losing. To exit a game, parents hold the 🏠 button.</p><div id="grid"></div></div>
<script>

var G=[

{n:'Paint',e:'🎨',bg:'#fffdf5',init:function(){this.b=[];this.lx=-99;this.ly=-99},

{n:'Peekaboo',e:'🙈',bg:'#d6e9ff',init:function(){this.o=0;this.s=0;this.k=0;this.f=P(['🐻','🐰','🐥','🦊','🐼'])},

{n:'Drums',e:'🥁',bg:'#2d2a4a',t:'#ffd1a8',init:function(){this.s=[1,1,1,1]},

{n:'Fireflies',e:'✨',bg:'#0f1a3a',t:'#fff0a0',init:function(){this.f=[];for(var i=0;i<28;i++)this.f.push({x:R(0,W),y:R(0,H),vx:0,vy:0,ph:R(0,6)})},
 update:function(dt){this.f.forEach(function(f){var tx=ptr.seen?ptr.x:W/2,ty=ptr.seen?ptr.y:H/2;f.vx+=(tx-f.x)*.0007*dt+R(-.12,.12);f.vy+=(ty-f.y)*.0007*dt+R(-.12,.12);f.vx*=.97;f.vy*=.97;f.x+=f.vx*dt;f.y+=f.vy*dt})},
 draw:function(){this.f.forEach(function(f){var a=.6+.4*Math.sin(t*.1+f.ph),g=x.createRadialGradient(f.x,f.y,0,f.x,f.y,34);g.addColorStop(0,'rgba(255,240,120,'+a+')');g.addColorStop(1,'rgba(255,240,120,0)');x.fillStyle=g;x.beginPath();x.arc(f.x,f.y,34,0,7);x.fill();x.fillStyle='rgba(255,255,230,'+a+')';x.beginPath();x.arc(f.x,f.y,5,0,7);x.fill()})},
 tap:function(){this.f.forEach(function(f){f.vx+=R(-7,7);f.vy+=R(-7,7)});tone(P([660,784,880]),.3,'sine',.1)}},
{n:'Pinwheel',e:'🎡',bg:'#fff3c4',init:function(){this.a=0;this.w=0;this.q=0},

 draw:function(){var cx=W/2,cy=H*.42,s=Math.min(W,H)*.38;x.strokeStyle='#8d6e63';x.lineWidth=10;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx,H);x.stroke();for(var i=0;i<4;i++){x.save();x.translate(cx,cy);x.rotate(this.a+i*Math.PI/2);x.fillStyle=COL[i];x.beginPath();x.moveTo(0,0);x.lineTo(s,0);x.lineTo(s*.7,-s*.55);x.closePath();x.fill();x.restore()}x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,16,0,7);x.fill()},
 tap:function(){this.w+=.15;tone(500,.08,'triangle',.1)},

];
$('grid').innerHTML=G.map(function(g,i){return '<button data-i="'+i+'" style="background:'+(g.t||g.bg)+'"><b>'+g.e+'</b><span>'+g.n+'</span></button>'}).join('');

// Launch the activity selected in the website library; invalid IDs keep the menu.
